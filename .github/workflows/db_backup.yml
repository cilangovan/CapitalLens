name: Database Backup

# Weekly schema snapshot into git (db/schema.sql + supabase/migrations/), plus a DAILY encrypted
# data dump shipped to Cloudflare R2 (db/r2_backup.sh keeps 7 daily / 5 weekly / 13 monthly).
# This repo is PUBLIC: data is never committed — it is encrypted with BACKUP_PASSPHRASE before it
# leaves the runner, and the run also keeps the encrypted file as a short-lived artifact fallback.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL        Session-pooler connection string (Supabase → Connect → Session pooler, port 5432)
#                          — enables pg_dump (full-fidelity dumps) and the schema export
#   or SUPABASE_ACCESS_TOKEN  (+ repo variable SUPABASE_PROJECT_REF) — schema export only, via the Management API
#   BACKUP_PASSPHRASE      required for data backups (gpg AES-256); keep a copy somewhere safe
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  (+ optional R2_BUCKET, default 'portfoliomanager')
#                          Cloudflare R2 destination (token scoped to the one bucket, Object Read & Write).
#                          If any is missing the R2 step is skipped with a warning (artifact only).

on:
  schedule:
    - cron: '17 3 * * 0'          # Sundays 03:17 UTC — schema snapshot
    - cron: '41 3 * * *'          # daily 03:41 UTC — encrypted data backup → R2
  workflow_dispatch:
    inputs:
      include_data:
        description: 'Also take an encrypted data backup'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'kloqkcxchstfoljpqcbq' }}

jobs:
  schema:
    name: Schema → git
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        id: creds
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then echo "mode=db" >> "$GITHUB_OUTPUT";
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "mode=api" >> "$GITHUB_OUTPUT";
          else
            echo "::warning title=No database credentials::Add the SUPABASE_DB_URL secret (or SUPABASE_ACCESS_TOKEN) to enable backups — see db/README.md"
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.creds.outputs.mode == 'db'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Export schema + migration history
        if: steps.creds.outputs.mode != 'none'
        run: python db/export_schema.py

      - name: Full schema dump (pg_dump, for migration tools)
        if: steps.creds.outputs.mode == 'db'
        run: |
          mkdir -p backup
          pg_dump "$SUPABASE_DB_URL" --schema-only --no-owner --no-privileges \
            --schema=public --file=backup/pg_dump_schema.sql
          pg_dump "$SUPABASE_DB_URL" --data-only --schema=supabase_migrations \
            --file=backup/supabase_migrations_history.sql
          ls -la backup

      - name: Upload pg_dump schema
        if: steps.creds.outputs.mode == 'db'
        uses: actions/upload-artifact@v4
        with:
          name: schema-${{ github.run_number }}
          path: backup/
          retention-days: 90

      - name: Commit schema changes
        if: steps.creds.outputs.mode != 'none'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/schema.sql supabase/migrations
          if git diff --cached --quiet; then echo "Schema unchanged."; exit 0; fi
          git commit -m "db: schema snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"

  data:
    name: Data → encrypted artifact
    if: (github.event_name == 'schedule' && github.event.schedule == '41 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.include_data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require secrets
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$SUPABASE_DB_URL" ]   || { echo "::error::SUPABASE_DB_URL secret is required for data backups"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::BACKUP_PASSPHRASE secret is required — data is never stored unencrypted"; exit 1; }

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump, compress, encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          f="t212-data-$(date -u +%Y%m%d-%H%M).sql.gz.gpg"
          # login table is excluded: credentials never leave the database
          pg_dump "$SUPABASE_DB_URL" --data-only --schema=public --no-owner --no-privileges \
              --exclude-table-data=public.dashboard_auth \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
                  --passphrase-fd 3 --output "$f" 3<<<"$BACKUP_PASSPHRASE"
          echo "FILE=$f" >> "$GITHUB_ENV"
          ls -la "$f"

      - name: Check the archive is complete
        run: |
          # The long history lives in the *_archive tables (moved there by db_maintenance) — make sure
          # they are inside the dump scope, which is --schema=public minus dashboard_auth.
          pg_dump "$SUPABASE_DB_URL" --schema-only --schema=public -t 'public.*_archive' \
            | grep -c 'CREATE TABLE public\..*_archive' | grep -qE '^[2-9]' \
            || { echo "::error::expected portfolio_snapshots_archive and positions_archive in the dump scope"; exit 1; }

      - name: Integrity check (decrypt + gunzip test)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 --decrypt "$FILE" 3<<<"$BACKUP_PASSPHRASE" | gzip -t
          # sanity: a data-only dump of this DB always contains COPY blocks for these tables
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 --decrypt "$FILE" 3<<<"$BACKUP_PASSPHRASE" \
            | gunzip | grep -q '^COPY public.t212_orders ' \
            || { echo "::error::dump looks empty — t212_orders is missing"; exit 1; }
          echo "Backup decrypts and unzips cleanly."

      - name: Ship to Cloudflare R2 (7 daily / 5 weekly / 13 monthly)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'portfoliomanager' }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning title=R2 not configured::R2_* secrets missing — backup kept only as a run artifact (see db/README.md)"
            exit 0
          fi
          db/r2_backup.sh "$FILE"

      # Fallback copy on the run itself (encrypted). Short retention now that R2 holds the real history.
      - name: Upload encrypted backup (artifact fallback)
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: ${{ env.FILE }}
          retention-days: 7
