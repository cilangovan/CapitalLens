name: Regression & data quality

# Every bug that was ever fixed has a guard test (tests/regression_register.json, documentation/regression-register.md).
# This workflow runs ALL of them in one place on every push, on pull requests and nightly, plus the data-quality checks
# on the shared (non-customer) data. Customer data is encrypted, so data quality never reads it.
on:
  push:
    paths: ['docs/**', 'tests/**', 'scripts/**', 'cloudflare-worker/**', 'config/**', 'services/**', 'db/**', 'CLAUDE.md', 'documentation/**', '.github/workflows/**']
  pull_request:
  schedule:
    - cron: '23 7 * * *'       # nightly, after the morning data refresh: live data-quality checks
  workflow_dispatch:

permissions:
  contents: read
  issues: write                # nightly failure opens / updates ONE issue ("Data quality failing")

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression guards (every fixed bug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the standards test reads commit messages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            tests/requirements.txt
      - run: pip install -r requirements.txt -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Every fix commit since the register began ships a test
        run: python3 scripts/regression_sync.py --check
      - name: Run every regression, data-quality and standards suite; log each check pass/fail to the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/regression_run.py --browser --log
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: regression_report.json
          if-no-files-found: ignore

  sync-register:
    name: Keep the register up to date from git history
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Add a row for every new fix commit and regenerate the register page
        run: python3 scripts/regression_sync.py --write
      - name: Commit if anything changed
        run: |
          python3 scripts/build_docs.py
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name cilangovan
            git config user.email 7702527+cilangovan@users.noreply.github.com
            git add -A
            git commit -m "test: sync regression register from git history"
            git push origin HEAD:main
          fi

  data-quality:
    name: Data quality (shared data, not customer data)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Data files in git (tickers, IPO calendar, Market Mood tabs)
        run: python3 tests/data_quality_test.py
      - name: Live shared tables (nightly or manual) - market cache freshness and IPO calendar rules
        id: live
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          python3 tests/data_quality_test.py --live 2>&1 | tee /tmp/dq.txt
          python3 tests/table_inventory_test.py --live 2>&1 | tee -a /tmp/dq.txt
      - name: Open or update the "Data quality failing" issue
        if: failure() && steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Nightly data-quality check failed on $(date -u +%F). Failing checks:"$'\n\n```\n'"$(grep '✗' -A1 /tmp/dq.txt | head -40)"$'\n```\n'"Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          n=$(gh issue list --state open --search '"Data quality failing" in:title' --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "Data quality failing" --label bug --body "$body" || gh issue create --title "Data quality failing" --body "$body"; fi
