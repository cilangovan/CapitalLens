name: UI tests (mobile layout)

# Every dashboard view must fit a phone screen — no sideways scrolling, nothing past the edge.
# Runs on every dashboard change, and daily after the data refresh (new data can break a layout too).
on:
  push:
    paths: ['docs/**', 'tests/**', 'documentation/**', '.github/workflows/ui_tests.yml']
  pull_request:
    paths: ['docs/**', 'tests/**']
  schedule:
    - cron: '47 7 * * 1-5'     # after the morning data refresh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Every view fits 360px and 390px screens · XSS attack pass
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -u tests/ui_layout_test.py
      - name: IPO card fits phone screens
        run: python -u tests/ipo_layout_test.py
      - name: Support Levels section fits phone screens
        run: python -u tests/support_layout_test.py
      - name: Dip Planner fits phone screens
        run: python -u tests/dipplan_layout_test.py
      - name: Profit tab pie check and £0 explanation fit phone screens
        run: python -u tests/profit_pies_layout_test.py
      - name: Appearance (themes, fonts, text size) fits phone screens
        run: python -u tests/appearance_layout_test.py
      - name: Watchlist amount box (no fixed budget) fits phone screens
        run: python -u tests/watchlist_amount_layout_test.py
      - name: Watchlist cards (arrange mode) fit phone screens
        run: python -u tests/watchlist_order_layout_test.py
      - name: 5-check review box fits phone screens
        run: python -u tests/fivecheck_layout_test.py
      - name: Recent purchases card fits phone screens
        run: python -u tests/recent_layout_test.py
      - name: No sign-in flash on refresh (private app, real browser)
        run: python -u tests/login_flash_browser_test.py
      - name: IPO watch / remove (real clicks)
        run: python -u tests/ipo_watch_browser_test.py
      - name: Documentation portal fits phone screens
        run: python -u tests/docs_layout_test.py
      - name: Ops page layout and signed-out view
        run: python -u tests/ops_layout_test.py
      - name: Demo sign-in, temporary login card and countdown fit phone screens
        run: python -u tests/demo_layout_test.py
      - name: Demo parity guard (every dashboard feature has demo data)
        env:
          DEMO_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
          DEMO_SERVICE_KEY: ${{ secrets.DEMO_SERVICE_KEY }}
        run: python -u tests/demo_parity_test.py
