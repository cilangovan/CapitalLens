name: Daily Portfolio Services

on:
  schedule:
    # 08:00 UTC Mon-Fri (daily services)
    - cron: '0 8 * * 1-5'
    # 07:00 UTC Sunday (weekly institutional flow report)
    - cron: '0 7 * * 0'
  workflow_dispatch:

jobs:
  history:
    name: Realised P&L + Dividends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run history service
        env:
          T212_API_KEY:         ${{ secrets.T212_API_KEY }}
          T212_API_SECRET:      ${{ secrets.T212_API_SECRET }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m services.history_service

  analyst:
    name: Analyst Ratings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run analyst service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m services.analyst_service

  returns:
    name: Returns Calculator
    runs-on: ubuntu-latest
    needs: analyst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run returns service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m services.returns_service

  strategy:
    name: Strategy Engine
    runs-on: ubuntu-latest
    needs: [analyst, returns]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run strategy service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m services.strategy_service

  value_buy:
    name: Value Buy Scores (PWI Scout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run value buy service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m services.value_buy_service

  holding_decisions:
    name: Holding Decision Scores
    runs-on: ubuntu-latest
    needs: institutional_flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run holding decision service
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m services.holding_decision_service

  institutional_flow:
    name: Global Institutional Capital Tracker
    runs-on: ubuntu-latest
    # Runs on Sunday schedule trigger or manual dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run institutional flow service
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m services.institutional_flow_service

  alerts:
    name: Alerts & Notifications
    runs-on: ubuntu-latest
    needs: [analyst, strategy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run alert service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m services.alert_service
