name: Deploy Cloudflare Worker

on:
  push:
    paths:
      - 'cloudflare-worker/worker.js'
      - '.github/workflows/deploy_worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker (t212-proxy + capitallens-proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Cloudflare API
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_DEPLOY_PAT }}
        run: |
          # Deploy under both names during the CapitalLens rename; drop t212-proxy once the dashboard points at the new one.
          for NAME in t212-proxy capitallens-proxy; do
          echo "== $NAME"
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${NAME}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -F "metadata={\"main_module\":\"worker.js\",\"bindings\":[{\"type\":\"plain_text\",\"name\":\"SUPABASE_URL\",\"text\":\"${SUPABASE_URL}\"},{\"type\":\"secret_text\",\"name\":\"SUPABASE_SERVICE_KEY\",\"text\":\"${SUPABASE_SERVICE_KEY}\"},{\"type\":\"secret_text\",\"name\":\"SUPABASE_KEY\",\"text\":\"${SUPABASE_KEY}\"},{\"type\":\"secret_text\",\"name\":\"SUPABASE_ANON_KEY\",\"text\":\"${SUPABASE_KEY}\"},{\"type\":\"secret_text\",\"name\":\"GH_PAT\",\"text\":\"${GH_PAT}\"},{\"type\":\"plain_text\",\"name\":\"GH_REPO\",\"text\":\"cilangovan/CapitalLens\"}]};type=application/json" \
            -F "worker.js=@cloudflare-worker/worker.js;type=application/javascript+module" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('✓ Deployed' if d.get('success') else f'✗ Failed: {d}')"
          # make sure the workers.dev URL is enabled for this script
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${NAME}/subdomain" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
            -d '{"enabled":true}' | python3 -c "import sys,json; d=json.load(sys.stdin); print('subdomain enabled' if d.get('success') else f'subdomain: {d}')"
          done
