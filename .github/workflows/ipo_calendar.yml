name: IPO Calendar

# Pushes config/ipo_calendar.json (public IPO data, no customer data) into the shared ipo_calendar table.
on:
  push:
    branches: [main]
    paths: ['config/ipo_calendar.json', 'services/ipo_service.py']
  schedule:
    - cron: '15 6 * * 1-5'     # weekdays 06:15 UTC
  workflow_dispatch:

concurrency:
  group: ipo-calendar
  cancel-in-progress: false

jobs:
  upsert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/ipo_service_test.py
      - run: python -m services.ipo_service --check
      - name: Upsert IPO calendar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m services.ipo_service
