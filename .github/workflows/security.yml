name: Security checks

# Runs on every change, daily, and weekly for the full XSS auto-fix cycle.
# Daily: static code scan + live probes + GitHub issue sync + Gmail digest.
# Push:  fast XSS gate (no auto-fix, blocks CI on new medium+ findings).
# Weekly (Mon 03:00 UTC): XSS scan + auto-fix + commit + issue sync.
on:
  push:
    paths: ['docs/**', 'cloudflare-worker/**', 'tests/**', '.github/workflows/security.yml']
  pull_request:
  schedule:
    - cron: '17 6 * * *'   # daily: static + live checks + issue sync + email
    - cron: '0 3 * * 1'    # weekly Mon 03:00 UTC: XSS auto-fix cycle
  workflow_dispatch:

permissions:
  contents: write   # for auto-fix commits
  issues: write     # for auto-opening/closing security issues

jobs:
  # ── Static code checks + live probes ──────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for a fresh worker deploy to go live
        if: github.event_name == 'push'
        run: sleep 60
      - name: Security checks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u tests/security_check.py

  # ── XSS scanner — push gate + weekly auto-fix ─────────────────────────────
  xss-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── On push: scan only (fast lint gate) ────────────────────────────────
      - name: XSS scan (push gate — no auto-fix)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python -u tests/security_scan.py --report --json
        # exits 1 on medium+ findings → blocks the push

      # ── On schedule/dispatch: scan + auto-fix + commit ─────────────────────
      - name: XSS scan + auto-fix
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -u tests/security_scan.py --fix --report --json

      - name: Commit auto-fixes (if any)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "cilangovan"
          git config user.email "7702527+cilangolan@users.noreply.github.com"
          git add docs/js/*.js documentation/security-scan-report.md documentation/security-findings.json || true
          if git diff --cached --quiet; then
            echo "No auto-fixes to commit."
          else
            git status --short
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "security: auto-fix XSS findings [${TIMESTAMP}]

auto-fixed by tests/security_scan.py --fix
report:  documentation/security-scan-report.md
findings: documentation/security-findings.json"
            git push origin main
          fi

      # ── Publish to GitHub Step Summary ─────────────────────────────────────
      - name: Publish scan report to Step Summary
        if: always()
        run: |
          if [ -f documentation/security-scan-report.md ]; then
            cat documentation/security-scan-report.md >> $GITHUB_STEP_SUMMARY
          fi

  # ── GitHub issue sync (daily + weekly) ────────────────────────────────────
  # Opens issues for new findings, closes issues for resolved ones.
  issue-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: xss-scan
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-run scan to get fresh findings JSON
        run: python -u tests/security_scan.py --json || true
        # || true: even if scan fails (findings exist) we still want the JSON for issue sync

      - name: Sync security findings → GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f documentation/security-findings.json ]; then
            python tests/security_issue_sync.py \
              --findings documentation/security-findings.json \
              --repo cilangovan/CapitalLens
          else
            echo "No findings JSON found — skipping issue sync."
          fi

  # ── Daily security email digest ────────────────────────────────────────────
  # Sends a categorised email: Frontend / Worker / CSP / Database,
  # open issues vs closed, and a PASS/FAIL summary.
  email-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [xss-scan, issue-sync]
    if: always() && github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-run scan for email data
        run: python -u tests/security_scan.py --json --report || true

      - name: Build and send security email digest
        env:
          GMAIL_FROM:        ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO_EMAIL:   ${{ secrets.DIGEST_TO_EMAIL }}
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
        run: python -u tests/security_email.py

  # ── Browser smoke test ─────────────────────────────────────────────────────
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt && python -m playwright install --with-deps chromium
      - name: Wait for a fresh deploy to go live
        if: github.event_name == 'push'
        run: sleep 90
      - name: Live dashboard in a real browser — sign-in reaches the worker
        run: python -u tests/live_smoke.py
