name: Swing back-test

# Re-runs the Swing tab's rules (docs/js/swing.js) over ~5 years of daily history for ~90 liquid stocks and commits the result to
# docs/data/swing_backtest.json. The Swing tab shows NO entries unless this result clears its gate (positive out-of-sample
# expectancy after costs, profit factor >= 1.2, and better than a random 10-day entry). Weekly, on a rule change, or by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'
  push:
    branches: [main]
    paths:
      - docs/js/swing.js
      - scripts/swing_backtest.mjs
      - config/swing_universe.json
      - config/swing_universe_b.json

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Engine unit tests first
        run: node tests/zk_swing_test.mjs
      - name: Back-test
        run: node scripts/swing_backtest.mjs --out docs/data/swing_backtest.json
      - name: Confirm the one book strategy that cleared the gate, on 100 stocks it was not chosen on
        run: node scripts/swing_backtest.mjs --universe swing_universe_b.json --only minervini_natural --out docs/data/swing_confirm.json
      - name: Commit the result
        run: |
          if [ -n "$(git status --porcelain docs/data)" ]; then
            git config user.name cilangovan
            git config user.email 7702527+cilangovan@users.noreply.github.com
            git add docs/data/swing_backtest.json docs/data/swing_confirm.json
            git commit -m "data: swing back-test result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
