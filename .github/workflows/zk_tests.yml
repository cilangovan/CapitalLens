name: Zero-knowledge tests

# Every browser-side security module has tests, and the private page (docs/zkapp/index.html) is generated and pinned by
# script hashes. This fails the push if a test fails OR if someone edited a script without regenerating the page
# (a stale hash would make browsers refuse the script).
on:
  push:
    paths: ['docs/**', 'tests/**', 'scripts/**', 'cloudflare-worker/**', 'config/**', 'CLAUDE.md', 'documentation/**', 'db/**', 'services/**', '.github/workflows/**']
  pull_request:
    paths: ['docs/**', 'tests/**', 'scripts/**', 'cloudflare-worker/**', 'config/**', 'CLAUDE.md', 'documentation/**', 'db/**', 'services/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zk-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the standards test reads commit messages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            tests/requirements.txt
      - name: Python deps for parity tests (real services run against a fake yfinance)
        run: pip install -r requirements.txt
      - name: Private page is up to date
        run: |
          python3 scripts/build_zkapp.py
          git diff --exit-code -- docs/zkapp docs/zkapp-prod docs/zk-prod || (echo "generated pages are stale: run python3 scripts/build_zkapp.py and commit" && exit 1)
      - name: Owner's standing requirements (CLAUDE.md)
        run: python3 tests/standards_test.py
      - name: Legacy pipeline survives a cut-off run (atomic snapshot save, resumable history catch-up)
        run: python3 tests/legacy_interrupt_test.py
      - name: Documentation portal is up to date
        run: python3 scripts/build_docs.py --check
      - name: Relay syntax
        run: cp cloudflare-worker/relay.js /tmp/relay.mjs && node --check /tmp/relay.mjs
      - name: Zero-knowledge test suites
        run: |
          fail=0
          for t in tests/zk_*_test.mjs; do echo "== $t"; node "$t" || fail=1; done
          exit $fail
