name: T212 Portfolio Monitor

on:
  schedule:
    # LSE open window: every 15 min 08:00–08:30 UTC
    - cron: "0,15,30 8 * * 1-5"
    # NASDAQ open window: every 15 min 14:30–15:00 UTC
    - cron: "30,45 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    # LSE close window: every 15 min 16:00–16:30 UTC
    - cron: "0,15,30 16 * * 1-5"
    # NASDAQ close window: every 15 min 20:30–21:00 UTC
    - cron: "30,45 20 * * 1-5"
    - cron: "0 21 * * 1-5"
    # Regular hours: every 45 min across full market day 07:00–21:00 UTC
    - cron: "0,45 7 * * 1-5"
    - cron: "0,45 9 * * 1-5"
    - cron: "0,45 10 * * 1-5"
    - cron: "0,45 11 * * 1-5"
    - cron: "0,45 12 * * 1-5"
    - cron: "0,45 13 * * 1-5"
    - cron: "0,45 17 * * 1-5"
    - cron: "0,45 18 * * 1-5"
    - cron: "0,45 19 * * 1-5"
    # 2hrs after NASDAQ close: 21:00–23:00 UTC (after-hours moves)
    - cron: "0,45 22 * * 1-5"
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: portfolio_state.json
          key: t212-state-${{ github.run_number }}
          restore-keys: |
            t212-state-

      - name: Run monitor
        env:
          T212_API_KEY:    ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:  ${{ secrets.GMAIL_APP_PASS }}
          NTFY_TOPIC:      ${{ secrets.NTFY_TOPIC }}
          SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python monitor.py


      - name: Push dashboard data
        run: |
          git config user.name  "T212 Monitor Bot"
          git config user.email "bot@t212monitor"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: update dashboard data [skip ci]"
          git push
