
name: T212 Portfolio Monitor

on:
  schedule:
    - cron: "*/15 7-17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: portfolio_state.json
          key: t212-state-${{ github.run_number }}
          restore-keys: |
            t212-state-

      - name: Run monitor
        env:
          T212_API_KEY:        ${{ secrets.T212_API_KEY }}
          T212_API_SECRET:     ${{ secrets.T212_API_SECRET }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:      ${{ secrets.GMAIL_APP_PASS }}
          NTFY_TOPIC:          ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_PASSWORD:  ${{ secrets.DASHBOARD_PASSWORD }}
        run: python monitor.py

      - name: Push dashboard data
        run: |
          git config user.name  "T212 Monitor Bot"
          git config user.email "bot@t212monitor"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: update dashboard data [skip ci]"
          git push
