<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOOP · T212 Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#060a14;--card:#0d1526;--card2:#111d35;--border:#1a2744;--text:#e8edf5;--muted:#4a6080;--muted2:#6b85a8;--green:#00d084;--red:#ff4757;--amber:#ffa502;--blue:#4a9eff;--purple:#9b6dff;}
  *{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:14px}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:#060a14;position:sticky;top:0;z-index:100}
  .logo{font-size:15px;font-weight:700;letter-spacing:-.02em}.logo em{color:var(--blue);font-style:normal}
  .hdr-right{display:flex;align-items:center;gap:12px}
  .live-info{font-size:11px;color:var(--muted2);display:flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .btn-sm{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--muted2);font-size:11px;cursor:pointer;transition:all .15s}
  .btn-sm:hover{border-color:var(--blue);color:var(--blue)}
  .wrap{max-width:1300px;margin:0 auto;padding:24px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px}
  .stat{background:var(--card);padding:16px 18px}.stat-label{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .stat-val{font-size:20px;font-weight:700;line-height:1}
  .g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}.b{color:var(--blue)}.mu{color:var(--muted2)}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
  @media(max-width:900px){.cols2{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px}
  .card-body{padding:18px}.chart-wrap{position:relative;height:230px}
  .alert{padding:11px 14px;border-radius:6px;margin-bottom:8px;border-left:3px solid}.alert:last-child{margin-bottom:0}
  .alert.dip{background:rgba(255,71,87,.08);border-color:var(--red)}.alert.buy{background:rgba(0,208,132,.08);border-color:var(--green)}
  .alert.trim{background:rgba(255,165,2,.08);border-color:var(--amber)}.alert.rebalance{background:rgba(155,109,255,.08);border-color:var(--purple)}
  .alert-title{font-weight:600;font-size:13px;margin-bottom:3px}.alert-body{color:var(--muted2);font-size:12px;line-height:1.5}
  .no-alerts{color:var(--muted);font-size:13px}
  .pie-group{margin-bottom:20px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .pie-group-header{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:var(--card2)}
  .pie-group-name{font-weight:700;font-size:14px}.pie-group-meta{display:flex;gap:16px;font-size:12px;color:var(--muted2)}
  .pie-group-meta strong{font-weight:600}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10px;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--border);font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:rgba(10,20,45,.8)}
  td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.03);font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:none}tr:hover td{background:rgba(255,255,255,.025)}
  .ticker-name{font-weight:600}.mini-bar{display:inline-flex;align-items:center;gap:8px}
  .bar-track{background:rgba(255,255,255,.06);border-radius:2px;height:4px;width:60px;overflow:hidden}.bar-fill{height:100%;border-radius:2px}
  #loading{display:flex;align-items:center;justify-content:center;height:80vh;flex-direction:column;gap:12px}
  .spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tab-bar{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--card)}
  .tab{padding:10px 16px;font-size:12px;font-weight:500;color:var(--muted2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue)}
  .tab-panel{display:none;padding:18px}.tab-panel.active{display:block}
  @media(max-width:600px){.wrap{padding:12px}.hide-sm{display:none}header{padding:12px 16px}}
</style>
</head>
<body>

<script>
  // Only this URL needed — no Supabase keys in frontend
  const API = "https://t212-proxy.itsme-daf.workers.dev";
</script>

<header>
  <div class="logo">HOOP · <em>T212</em> Monitor</div>
  <div class="hdr-right">
    <div class="live-info"><span class="dot"></span><span id="updated">—</span></div>
    <button class="btn-sm" onclick="loadAll()">↻ Refresh</button>
  </div>
</header>

<div id="loading"><div class="spinner"></div><span style="color:var(--muted);font-size:13px">Loading portfolio...</span></div>

<div id="app" style="display:none">
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="card">
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('overview')">Overview</div>
      <div class="tab" onclick="switchTab('positions')">Positions</div>
      <div class="tab" onclick="switchTab('history')">History</div>
      <div class="tab" onclick="switchTab('alertlog')">Alert Log</div>
    </div>
    <div class="tab-panel active" id="tab-overview">
      <div class="cols2">
        <div>
          <div style="font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Active Alerts</div>
          <div id="alerts-body"></div>
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Gain % — All Positions</div>
          <div class="chart-wrap"><canvas id="gainChart"></canvas></div>
        </div>
      </div>
      <div class="cols2">
        <div>
          <div style="font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Portfolio by Pie</div>
          <div class="chart-wrap" style="height:260px"><canvas id="pieChart"></canvas></div>
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">P&L — Top Positions</div>
          <div class="chart-wrap"><canvas id="plChart"></canvas></div>
        </div>
      </div>
    </div>
    <div class="tab-panel" id="tab-positions">
      <div id="groups-container"></div>
    </div>
    <div class="tab-panel" id="tab-history">
      <div style="font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Portfolio value over time</div>
      <div class="chart-wrap" style="height:300px"><canvas id="historyChart"></canvas></div>
    </div>
    <div class="tab-panel" id="tab-alertlog">
      <div style="font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Recent alerts</div>
      <table>
        <thead><tr><th>Time</th><th>Type</th><th>Ticker</th><th class="hide-sm">Message</th></tr></thead>
        <tbody id="alert-log-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
</div>

<script>
const PIE_COLORS=['#4a9eff','#00d084','#9b6dff','#ffa502','#00c9b1','#ff4757','#ff6b81','#eccc68','#48dbfb','#ff9f43'];
let charts={};

function switchTab(n){
  const names=['overview','positions','history','alertlog'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',names[i]===n));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active');
}

function fmt(n,d=2){return Number(n).toFixed(d);}
function sign(n){return n>=0?'+':'';}
function gc(n){return n>=0?'g':'r';}
function clean(t){return(t||'').split('_')[0];}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};}

async function sbGet(table,params={}){
  const url=new URL(`${API}/${table}`);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  try{
    const r=await fetch(url);
    if(!r.ok)throw new Error(await r.text());
    return await r.json();
  }catch(e){console.error('[api]',table,e);return null;}
}

async function loadAll(){
  try{
    const [snapshots,history,alertLog]=await Promise.all([
      sbGet("portfolio_snapshots",{select:"*",order:"created_at.desc",limit:"1"}),
      sbGet("portfolio_snapshots",{select:"created_at,total_value,cash,total_ppl",order:"created_at.desc",limit:"60"}),
      sbGet("alerts",{select:"*",order:"created_at.desc",limit:"50"}),
    ]);
    if(!snapshots||snapshots.length===0){
      document.getElementById('loading').innerHTML='<span style="color:var(--muted)">No data yet — run the GitHub Action first.</span>';
      return;
    }
    const snap=snapshots[0];
    const positions=await sbGet("positions",{snapshot_id:`eq.${snap.id}`,select:"*"});
    const twoHoursAgo=new Date(Date.now()-2*60*60*1000).toISOString();
    const activeAlerts=(alertLog||[]).filter(a=>a.created_at>twoHoursAgo);
    render(snap,positions||[],activeAlerts,history||[],alertLog||[]);
  }catch(e){
    document.getElementById('loading').innerHTML=`<span style="color:var(--red)">Error: ${e.message}</span>`;
  }
}

function render(snap,positions,activeAlerts,history,alertLog){
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('updated').textContent=new Date(snap.created_at).toLocaleString('en-GB');

  const total=parseFloat(snap.total_value||0),cash=parseFloat(snap.cash||0);
  const invested=total-cash,totalPL=parseFloat(snap.total_ppl||0);
  const winners=positions.filter(p=>p.gain_pct>0).length,losers=positions.filter(p=>p.gain_pct<0).length;

  document.getElementById('stats').innerHTML=[
    {l:'Total value',v:'£'+fmt(total),c:'b'},{l:'Invested',v:'£'+fmt(invested),c:''},
    {l:'Cash',v:'£'+fmt(cash),c:''},{l:'Total P&L',v:sign(totalPL)+'£'+fmt(Math.abs(totalPL)),c:gc(totalPL)},
    {l:'Winners',v:winners,c:'g'},{l:'Losers',v:losers,c:losers>0?'r':'g'},
    {l:'Positions',v:positions.length,c:'b'},{l:'Alerts',v:activeAlerts.length,c:activeAlerts.length>0?'a':'g'},
  ].map(s=>`<div class="stat"><div class="stat-label">${s.l}</div><div class="stat-val ${s.c}">${s.v}</div></div>`).join('');

  document.getElementById('alerts-body').innerHTML=activeAlerts.length===0
    ?'<div class="no-alerts">✓ No alerts in last 2 hours</div>'
    :activeAlerts.map(a=>`<div class="alert ${a.type}"><div class="alert-title">${a.title}</div><div class="alert-body">${a.body}</div></div>`).join('');

  destroyCharts();

  const sorted=[...positions].sort((a,b)=>b.gain_pct-a.gain_pct).slice(0,16);
  charts.gain=new Chart(document.getElementById('gainChart'),{type:'bar',
    data:{labels:sorted.map(p=>clean(p.ticker)),datasets:[{data:sorted.map(p=>p.gain_pct),
      backgroundColor:sorted.map(p=>p.gain_pct>=0?'rgba(0,208,132,.75)':'rgba(255,71,87,.75)'),borderRadius:4,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>sign(c.raw)+fmt(c.raw,1)+'%'}}},
      scales:{x:{ticks:{color:'#4a6080',font:{size:10}},grid:{color:'rgba(255,255,255,.04)'}},
              y:{ticks:{color:'#4a6080',font:{size:10},callback:v=>v+'%'},grid:{color:'rgba(255,255,255,.04)'}}}}});

  const groups={};
  positions.forEach(p=>{const g=p.pie||'Solo holdings';if(!groups[g])groups[g]={value:0,pl:0};
    const cost=p.gain_pct!==0?Math.abs(p.ppl)/(Math.abs(p.gain_pct)/100):0;
    groups[g].value+=cost+(p.ppl||0);groups[g].pl+=p.ppl||0;});
  const gNames=Object.keys(groups);
  charts.pie=new Chart(document.getElementById('pieChart'),{type:'doughnut',
    data:{labels:gNames,datasets:[{data:gNames.map(n=>Math.max(groups[n].value,0.01)),
      backgroundColor:PIE_COLORS.slice(0,gNames.length),borderColor:'#060a14',borderWidth:3}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'60%',
      plugins:{legend:{position:'right',labels:{color:'#6b85a8',font:{size:12},boxWidth:12,padding:12}},
        tooltip:{callbacks:{label:c=>{const n=c.label,pl=groups[n]?.pl||0;
          return ` £${fmt(c.raw)} · P&L ${sign(pl)}£${fmt(Math.abs(pl))}`;}}}}}});

  const plSorted=[...positions].sort((a,b)=>b.ppl-a.ppl).slice(0,14);
  charts.pl=new Chart(document.getElementById('plChart'),{type:'bar',
    data:{labels:plSorted.map(p=>clean(p.ticker)),datasets:[{data:plSorted.map(p=>p.ppl),
      backgroundColor:plSorted.map(p=>p.ppl>=0?'rgba(0,208,132,.75)':'rgba(255,71,87,.75)'),borderRadius:4,borderSkipped:false}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>sign(c.raw)+'£'+fmt(Math.abs(c.raw))}}},
      scales:{x:{ticks:{color:'#4a6080',font:{size:10},callback:v=>'£'+v},grid:{color:'rgba(255,255,255,.04)'}},
              y:{ticks:{color:'#6b85a8',font:{size:11}},grid:{display:false}}}}});

  if(history.length>1){
    const hRev=[...history].reverse();
    charts.history=new Chart(document.getElementById('historyChart'),{type:'line',
      data:{labels:hRev.map(h=>new Date(h.created_at).toLocaleDateString('en-GB')),
        datasets:[
          {label:'Total Value',data:hRev.map(h=>h.total_value),borderColor:'#4a9eff',backgroundColor:'rgba(74,158,255,.1)',fill:true,tension:.3,pointRadius:2},
          {label:'Total P&L',data:hRev.map(h=>h.total_ppl),borderColor:'#00d084',backgroundColor:'rgba(0,208,132,.1)',fill:true,tension:.3,pointRadius:2},
        ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:'#6b85a8',font:{size:11}}}},
        scales:{x:{ticks:{color:'#4a6080',font:{size:10},maxTicksLimit:10},grid:{color:'rgba(255,255,255,.04)'}},
                y:{ticks:{color:'#4a6080',font:{size:10},callback:v=>'£'+v},grid:{color:'rgba(255,255,255,.04)'}}}}});}

  const gc2={};
  positions.forEach(p=>{const g=p.pie||'Solo holdings';if(!gc2[g])gc2[g]=[];gc2[g].push(p);});
  const sortedGroups=Object.keys(gc2).sort((a,b)=>{
    if(a==='Solo holdings')return 1;if(b==='Solo holdings')return -1;return a.localeCompare(b);});
  const colorMap={};sortedGroups.forEach((g,i)=>colorMap[g]=PIE_COLORS[i%PIE_COLORS.length]);
  document.getElementById('groups-container').innerHTML=sortedGroups.map(grpName=>{
    const rows=gc2[grpName].sort((a,b)=>b.gain_pct-a.gain_pct);
    const grpPL=rows.reduce((s,r)=>s+(r.ppl||0),0),grpW=rows.filter(r=>r.gain_pct>0).length;
    const color=colorMap[grpName],plColor=grpPL>=0?'var(--green)':'var(--red)';
    const rowsHTML=rows.map(r=>{
      const rg=r.gain_pct>=0?'var(--green)':'var(--red)';
      const dipC=r.dip_from_high>=12?'var(--red)':r.dip_from_high>=8?'var(--amber)':'var(--muted2)';
      const bw=Math.min(100,r.dip_from_high*5),bc=r.dip_from_high>=12?'var(--red)':r.dip_from_high>=8?'var(--amber)':'var(--green)';
      return `<tr>
        <td><span class="ticker-name">${clean(r.ticker)}</span></td>
        <td style="color:var(--muted2)">£${fmt(r.current_price)}</td>
        <td style="color:${rg}">${sign(r.gain_pct)}${fmt(r.gain_pct,1)}%</td>
        <td style="color:${rg}">${sign(r.ppl)}£${fmt(Math.abs(r.ppl))}</td>
        <td class="hide-sm"><div class="mini-bar">
          <span style="color:${dipC};min-width:38px">${fmt(r.dip_from_high,1)}%</span>
          <div class="bar-track"><div class="bar-fill" style="width:${bw}%;background:${bc}"></div></div>
        </div></td>
        <td class="hide-sm" style="color:var(--muted)">£${fmt(r.avg_price)} avg</td>
      </tr>`;
    }).join('');
    return `<div class="pie-group">
      <div class="pie-group-header" style="border-left:4px solid ${color}">
        <span class="pie-group-name" style="color:${color}">${grpName}</span>
        <div class="pie-group-meta">
          <span>${rows.length} positions</span><span>${grpW}W / ${rows.length-grpW}L</span>
          <span>P&L <strong style="color:${plColor}">${sign(grpPL)}£${fmt(Math.abs(grpPL))}</strong></span>
        </div>
      </div>
      <table><thead><tr>
        <th>Ticker</th><th>Price</th><th>Gain</th><th>P&L</th>
        <th class="hide-sm">From high</th><th class="hide-sm">Avg cost</th>
      </tr></thead><tbody>${rowsHTML}</tbody></table>
    </div>`;
  }).join('');

  document.getElementById('alert-log-tbody').innerHTML=alertLog.map(a=>{
    const tc={'dip':'var(--red)','buy':'var(--green)','trim':'var(--amber)','rebalance':'var(--purple)'};
    return `<tr>
      <td style="color:var(--muted);white-space:nowrap;font-size:12px">${new Date(a.created_at).toLocaleString('en-GB')}</td>
      <td style="color:${tc[a.type]||'var(--muted2)'};font-weight:600;text-transform:uppercase;font-size:11px">${a.type}</td>
      <td style="font-weight:600">${a.ticker||'—'}</td>
      <td class="hide-sm" style="color:var(--muted2);font-size:12px">${a.body}</td>
    </tr>`;
  }).join('')||'<tr><td colspan="4" style="color:var(--muted);text-align:center;padding:20px">No alerts yet</td></tr>';
}

setInterval(loadAll,5*60*1000);
loadAll();
</script>
</body>
</html>
