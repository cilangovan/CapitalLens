<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T212 Portfolio Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --bg2: #1a1d27; --bg3: #22263a;
    --text: #e2e8f0; --muted: #8892a4; --border: #2d3353;
    --green: #22c55e; --red: #ef4444; --yellow: #f59e0b;
    --blue: #3b82f6; --purple: #a78bfa; --cyan: #06b6d4;
    --accent: #6366f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }
  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; color: var(--text); }
  header .pill { background: var(--accent); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  #last-updated { margin-left: auto; font-size: 11px; color: var(--muted); }
  nav { background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; }
  nav button { background: none; border: none; color: var(--muted); padding: 10px 16px; cursor: pointer; font-size: 13px; white-space: nowrap; border-bottom: 2px solid transparent; transition: all .15s; }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab { display: none; padding: 20px; }
  .tab.active { display: block; }
  .stats-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .stat-card .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .stat-card .value { font-size: 20px; font-weight: 700; }
  .stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .green { color: var(--green); } .red { color: var(--red); } .yellow { color: var(--yellow); }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media(max-width:640px){ .grid2,.grid3 { grid-template-columns: 1fr; } }
  .alert-item { background: var(--bg3); border-left: 3px solid var(--yellow); border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; }
  .alert-item.buy { border-left-color: var(--green); }
  .alert-item.sell { border-left-color: var(--red); }
  .alert-item .a-title { font-weight: 600; font-size: 13px; }
  .alert-item .a-body { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .alert-item .a-time { font-size: 11px; color: var(--muted); margin-top: 4px; }
  /* Heatmap */
  #heatmap-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .hm-tile { border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: default; transition: transform .1s; font-weight: 600; }
  .hm-tile:hover { transform: scale(1.04); }
  .hm-tile .hm-tick { font-size: 11px; opacity: .8; }
  .hm-tile .hm-pct { font-size: 15px; }
  /* Positions accordion */
  .pie-group { margin-bottom: 10px; }
  .pie-header { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .pie-header:hover { background: var(--bg2); }
  .pie-header .pie-name { font-weight: 600; }
  .pie-header .pie-meta { font-size: 12px; color: var(--muted); }
  .pie-body { display: none; border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px; overflow: hidden; }
  .pie-body.open { display: block; }
  .pos-row { display: grid; grid-template-columns: 1fr 80px 80px 80px 80px 90px; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 12px; align-items: center; }
  .pos-row:last-child { border-bottom: none; }
  .pos-row .pos-head { color: var(--muted); font-size: 11px; font-weight: 600; }
  /* Analyst */
  .analyst-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .analyst-table th { text-align: left; padding: 8px 10px; color: var(--muted); border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; }
  .analyst-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .analyst-table tr:last-child td { border-bottom: none; }
  .stars { color: var(--yellow); letter-spacing: -2px; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 600; }
  .badge.buy { background: rgba(34,197,94,.2); color: var(--green); }
  .badge.hold { background: rgba(245,158,11,.2); color: var(--yellow); }
  .badge.sell { background: rgba(239,68,68,.2); color: var(--red); }
  .badge.strong_buy { background: rgba(34,197,94,.35); color: var(--green); }
  /* Strategy */
  .rec-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
  .rec-card .rec-pie { font-weight: 700; font-size: 15px; }
  .rec-card .rec-reason { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .rec-card .rec-amount { font-size: 22px; font-weight: 700; color: var(--green); white-space: nowrap; }
  .priority-HIGH { border-left: 3px solid var(--green); }
  .priority-MEDIUM { border-left: 3px solid var(--yellow); }
  .priority-LOW { border-left: 3px solid var(--muted); }
  /* Returns */
  .xirr-banner { text-align: center; padding: 24px; }
  .xirr-banner .big { font-size: 48px; font-weight: 800; }
  .xirr-banner .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .loading { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
  canvas { max-width: 100%; }
</style>
</head>
<body>

<header>
  <h1>🌐 T212 Portfolio Monitor</h1>
  <span class="pill">LIVE</span>
  <span id="last-updated"></span>
</header>

<nav>
  <button class="active" onclick="showTab('overview',this)">📊 Overview</button>
  <button onclick="showTab('heatmap',this)">🔥 Heatmap</button>
  <button onclick="showTab('positions',this)">📋 Positions</button>
  <button onclick="showTab('analyst',this)">🔬 Analyst</button>
  <button onclick="showTab('strategy',this)">🎯 Strategy</button>
  <button onclick="showTab('returns',this)">📈 Returns</button>
  <button onclick="showTab('alerts',this)">🔔 Alerts</button>
</nav>

<div id="overview" class="tab active">
  <div id="stats-strip" class="stats-strip"><div class="loading">Loading…</div></div>
  <div class="grid2">
    <div class="card"><h3>Gain % by Position</h3><canvas id="gain-bar"></canvas></div>
    <div class="card"><h3>Portfolio by Pie</h3><canvas id="pie-doughnut"></canvas></div>
  </div>
  <div class="card"><h3>Active Alerts</h3><div id="active-alerts"><div class="loading">Loading…</div></div></div>
</div>

<div id="heatmap" class="tab">
  <div class="card"><h3>Price Heatmap — coloured by gain %, sized by P&L <span id="heatmap-updated" style="font-size:12px;font-weight:400;color:var(--muted);margin-left:8px;"></span></h3><div id="heatmap-grid"><div class="loading">Loading…</div></div></div>
</div>

<div id="positions" class="tab">
  <div id="positions-list"><div class="loading">Loading…</div></div>
</div>

<div id="analyst" class="tab">
  <div id="pie-ratings" class="grid3"></div>
  <div class="card"><h3>Full Analyst Ratings</h3><div id="analyst-table-wrap"><div class="loading">Loading…</div></div></div>
</div>

<div id="strategy" class="tab">
  <div id="strategy-content"><div class="loading">Loading…</div></div>
</div>

<div id="returns" class="tab">
  <div id="returns-content"><div class="loading">Loading…</div></div>
</div>

<div id="alerts" class="tab">
  <div id="alerts-log"><div class="loading">Loading…</div></div>
</div>

<script>
const PROXY = 'https://t212-proxy.itsme-daf.workers.dev';
let _cache = {};

async function api(table, params='') {
  const key = table + params;
  if (_cache[key]) return _cache[key];
  const r = await fetch(`${PROXY}/${table}${params}`);
  if (!r.ok) throw new Error(`${r.status} ${table}`);
  const d = await r.json();
  _cache[key] = d;
  return d;
}

function showTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  loadTab(id);
}

function fmt(v, dec=2) { return v == null ? '—' : Number(v).toFixed(dec); }
function fmtGbp(v) { return v == null ? '—' : '£' + Number(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function clr(v) { return v > 0 ? 'green' : v < 0 ? 'red' : ''; }
function stars(n) { return '★'.repeat(n || 0) + '☆'.repeat(5-(n||0)); }
function badgeRec(r) {
  const cls = r === 'strong_buy' ? 'strong_buy' : r === 'buy' ? 'buy' : r === 'hold' ? 'hold' : 'sell';
  return `<span class="badge ${cls}">${(r||'—').replace('_',' ').toUpperCase()}</span>`;
}

// ── OVERVIEW ──────────────────────────────────────────────────
async function loadOverview() {
  const [snaps, positions, alerts] = await Promise.all([
    api('portfolio_snapshots','?select=*&order=created_at.desc&limit=1'),
    api('positions','?select=*&order=gain_pct.desc&limit=1'),  // just to warm cache
    api('alerts','?select=*&order=created_at.desc&limit=5'),
  ]);

  const snap = snaps[0] || {};
  const tv = snap.total_value || 0;
  const cash = snap.cash || 0;
  const inv = snap.invested || 0;
  const ppl = snap.total_ppl || (tv - inv);
  const pplPct = inv ? (ppl / inv * 100) : 0;
  const ts = snap.created_at ? new Date(snap.created_at).toLocaleString('en-GB') : '—';
  document.getElementById('last-updated').textContent = `Updated: ${ts}`;

  document.getElementById('stats-strip').innerHTML = `
    <div class="stat-card"><div class="label">Total Value</div><div class="value">${fmtGbp(tv)}</div></div>
    <div class="stat-card"><div class="label">Cash</div><div class="value">${fmtGbp(cash)}</div></div>
    <div class="stat-card"><div class="label">Invested</div><div class="value">${fmtGbp(inv)}</div></div>
    <div class="stat-card"><div class="label">P&L</div><div class="value ${clr(ppl)}">${fmtGbp(ppl)}</div><div class="sub ${clr(pplPct)}">${fmt(pplPct)}%</div></div>
    <div class="stat-card"><div class="label">Run #</div><div class="value">${snap.run_count || '—'}</div></div>
  `;

  // Active alerts
  const alertsHtml = alerts.length
    ? alerts.map(a => {
        const cls = a.type === 'buy' ? 'buy' : a.type === 'sell' ? 'sell' : '';
        return `<div class="alert-item ${cls}"><div class="a-title">${a.title||''}</div><div class="a-body">${a.body||''}</div><div class="a-time">${a.created_at ? new Date(a.created_at).toLocaleString('en-GB') : ''}</div></div>`;
      }).join('')
    : '<div class="loading">No recent alerts</div>';
  document.getElementById('active-alerts').innerHTML = alertsHtml;

  // Charts
  await loadOverviewCharts();
}

async function loadOverviewCharts() {
  const snap = (await api('portfolio_snapshots','?select=*&order=created_at.desc&limit=1'))[0];
  if (!snap) return;
  const positions = await api('positions', `?snapshot_id=eq.${snap.id}&select=*&order=gain_pct.desc`);

  // Gain bar
  const ctx1 = document.getElementById('gain-bar').getContext('2d');
  if (ctx1._chart) ctx1._chart.destroy();
  ctx1._chart = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: positions.map(p => p.ticker || p.display || '?'),
      datasets: [{
        data: positions.map(p => +(p.gain_pct || 0).toFixed(2)),
        backgroundColor: positions.map(p => (p.gain_pct||0) >= 0 ? 'rgba(34,197,94,.7)' : 'rgba(239,68,68,.7)'),
        borderRadius: 3,
      }]
    },
    options: { plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#8892a4',font:{size:9}},grid:{color:'#2d3353'}}, y:{ticks:{color:'#8892a4'},grid:{color:'#2d3353'}} }, responsive:true }
  });

  // Doughnut — group by pie
  const pieMap = {};
  positions.forEach(p => {
    const pie = p.pie || 'Solo';
    pieMap[pie] = (pieMap[pie] || 0) + (p.ppl != null ? +p.ppl : 0);
  });
  const pienames = Object.keys(pieMap);
  const COLORS = ['#6366f1','#22c55e','#f59e0b','#3b82f6','#ef4444','#06b6d4','#a78bfa','#ec4899','#84cc16'];
  const ctx2 = document.getElementById('pie-doughnut').getContext('2d');
  if (ctx2._chart) ctx2._chart.destroy();
  ctx2._chart = new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: pienames,
      datasets: [{ data: pienames.map(k => pieMap[k]), backgroundColor: COLORS }]
    },
    options: { plugins:{ legend:{ position:'right', labels:{ color:'#e2e8f0', font:{size:11} } } }, responsive:true }
  });
}

// ── HEATMAP ───────────────────────────────────────────────────
async function loadHeatmap() {
  const snap = (await api('portfolio_snapshots','?select=*&order=created_at.desc&limit=1'))[0];
  if (!snap) return;
  const positions = await api('positions', `?snapshot_id=eq.${snap.id}&select=*`);

  const minPpl = Math.min(...positions.map(p => p.ppl||0));
  const maxPpl = Math.max(...positions.map(p => p.ppl||0));
  const range = maxPpl - minPpl || 1;

  const grid = document.getElementById('heatmap-grid');
  grid.innerHTML = '';

  // Show snapshot date in header
  const snapDate = new Date(snap.created_at);
  const snapLabel = snapDate.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  document.getElementById('heatmap-updated').textContent = `· data as of ${snapLabel}`;

  positions.forEach(p => {
    const gain = p.gain_pct || 0;
    const ppl = p.ppl || 0;
    const size = 60 + Math.abs(ppl - minPpl) / range * 80;
    const alpha = Math.min(0.9, 0.3 + Math.abs(gain) / 40);
    const bg = gain >= 0 ? `rgba(34,197,94,${alpha})` : `rgba(239,68,68,${alpha})`;
    const tile = document.createElement('div');
    tile.className = 'hm-tile';
    tile.style.cssText = `width:${size}px;height:${size}px;background:${bg};`;
    tile.title = `${p.display||p.ticker} | Gain: ${fmt(gain)}% | P&L: ${fmtGbp(ppl)} | Dip: ${fmt(p.dip_from_high)}%`;
    tile.innerHTML = `<span class="hm-tick">${p.ticker||''}</span><span class="hm-pct">${fmt(gain,1)}%</span>`;
    grid.appendChild(tile);
  });
}

// ── POSITIONS ─────────────────────────────────────────────────
async function loadPositions() {
  const snap = (await api('portfolio_snapshots','?select=*&order=created_at.desc&limit=1'))[0];
  if (!snap) return;
  const positions = await api('positions', `?snapshot_id=eq.${snap.id}&select=*`);
  const analystRows = await api('analyst_ratings','?select=ticker,star_rating,recommendation').catch(()=>[]);
  const analystMap = {};
  analystRows.forEach(a => { analystMap[a.ticker] = a; });

  // Group by pie
  const groups = {};
  positions.forEach(p => {
    const pie = p.pie || 'Solo';
    if (!groups[pie]) groups[pie] = [];
    groups[pie].push(p);
  });

  const container = document.getElementById('positions-list');
  container.innerHTML = '';

  Object.entries(groups).forEach(([pieName, pos]) => {
    const totalPpl = pos.reduce((s,p) => s + (p.ppl||0), 0);
    const div = document.createElement('div');
    div.className = 'pie-group';
    div.innerHTML = `
      <div class="pie-header" onclick="togglePie(this)">
        <span class="pie-name">${pieName}</span>
        <span class="pie-meta">${pos.length} holdings · P&L <span class="${clr(totalPpl)}">${fmtGbp(totalPpl)}</span></span>
      </div>
      <div class="pie-body">
        <div class="pos-row">
          <span class="pos-head">Ticker</span>
          <span class="pos-head">Price</span>
          <span class="pos-head">Avg</span>
          <span class="pos-head">Gain %</span>
          <span class="pos-head">Dip</span>
          <span class="pos-head">Analyst</span>
        </div>
        ${pos.map(p => {
          const a = analystMap[p.ticker] || {};
          const analystHtml = a.star_rating
            ? `<span class="stars">${'★'.repeat(a.star_rating)}</span> ${badgeRec(a.recommendation)}`
            : '—';
          return `<div class="pos-row">
            <span>${p.display||p.ticker}</span>
            <span>${fmtGbp(p.current_price)}</span>
            <span>${fmtGbp(p.avg_price)}</span>
            <span class="${clr(p.gain_pct)}">${fmt(p.gain_pct)}%</span>
            <span class="${clr(p.dip_from_high)}">${fmt(p.dip_from_high)}%</span>
            <span>${analystHtml}</span>
          </div>`;
        }).join('')}
      </div>`;
    container.appendChild(div);
  });
}

function togglePie(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('open');
}

// ── ANALYST ───────────────────────────────────────────────────
async function loadAnalyst() {
  const rows = await api('analyst_ratings','?select=*&order=star_rating.desc');

  // Pie summary cards
  const byPie = {};
  rows.forEach(r => {
    if (!byPie[r.pie]) byPie[r.pie] = [];
    byPie[r.pie].push(r);
  });

  const pieRatingsEl = document.getElementById('pie-ratings');
  pieRatingsEl.innerHTML = Object.entries(byPie).map(([pie, tickers]) => {
    const avgStar = (tickers.reduce((s,t) => s + (t.star_rating||0), 0) / tickers.length).toFixed(1);
    const avgBuy = (tickers.reduce((s,t) => s + (t.buy_pct||0), 0) / tickers.length).toFixed(0);
    return `<div class="card">
      <h3>${pie}</h3>
      <div style="font-size:22px;color:var(--yellow)">${'★'.repeat(Math.round(avgStar))}${'☆'.repeat(5-Math.round(avgStar))}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">⭐ ${avgStar} avg · ${avgBuy}% buy</div>
    </div>`;
  }).join('');

  // Full table
  const tableHtml = `<table class="analyst-table">
    <thead><tr><th>Ticker</th><th>Pie</th><th>Rating</th><th>Stars</th><th>Target</th><th>Buy%</th><th>Hold%</th><th>Sell%</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td><strong>${r.ticker}</strong></td>
      <td style="color:var(--muted)">${r.pie||'—'}</td>
      <td>${badgeRec(r.recommendation)}</td>
      <td><span class="stars">${stars(r.star_rating)}</span></td>
      <td>${r.target_mean ? '£'+Number(r.target_mean).toFixed(2) : '—'}</td>
      <td class="green">${r.buy_pct != null ? r.buy_pct+'%' : '—'}</td>
      <td class="yellow">${r.hold_pct != null ? r.hold_pct+'%' : '—'}</td>
      <td class="red">${r.sell_pct != null ? r.sell_pct+'%' : '—'}</td>
    </tr>`).join('')}</tbody></table>`;
  document.getElementById('analyst-table-wrap').innerHTML = tableHtml;
}

// ── STRATEGY ──────────────────────────────────────────────────
async function loadStrategy() {
  const rows = await api('strategy_recommendations','?select=*&order=updated_at.desc&limit=1');
  const s = rows[0];
  const el = document.getElementById('strategy-content');
  if (!s) { el.innerHTML = '<div class="loading">No strategy data yet. Run daily_services workflow.</div>'; return; }

  const recs = s.recommendations || [];
  const notes = s.notes || [];
  const onTrack = s.on_track;
  const weekNames = {1:'Core',2:'Growth',3:'Dip Buy',4:'Concentrate'};

  el.innerHTML = `
    <div class="stats-strip" style="margin-bottom:16px">
      <div class="stat-card"><div class="label">Week</div><div class="value">${s.week_number} of 4</div><div class="sub">${weekNames[s.week_number]||''}</div></div>
      <div class="stat-card"><div class="label">Suggested</div><div class="value green">£${s.total_suggested}</div></div>
      <div class="stat-card"><div class="label">Annualised</div><div class="value ${clr(s.annualised_return)}">${fmt(s.annualised_return)}%</div></div>
      <div class="stat-card"><div class="label">On Track?</div><div class="value ${onTrack?'green':'red'}">${onTrack?'✓ Yes':'✗ No'}</div><div class="sub">Target: 15%</div></div>
    </div>
    <div class="card"><h3>Recommendations</h3>
      ${recs.map(r => `<div class="rec-card priority-${r.priority||'LOW'}">
        <div><div class="rec-pie">${r.pie}</div><div class="rec-reason">${r.reason||''}</div></div>
        <div class="rec-amount">£${r.amount}</div>
      </div>`).join('')}
    </div>
    <div class="card"><h3>Notes</h3>
      ${notes.map(n => `<div style="font-size:12px;color:var(--muted);padding:3px 0">${n}</div>`).join('')}
    </div>`;
}

// ── RETURNS ───────────────────────────────────────────────────
async function loadReturns() {
  const rows = await api('returns_summary','?select=*&limit=1');
  const r = rows[0];
  const el = document.getElementById('returns-content');
  if (!r) { el.innerHTML = '<div class="loading">No returns data yet. Run daily_services workflow.</div>'; return; }

  const yearly = r.yearly_breakdown || {};
  const monthly = r.monthly_breakdown || {};

  el.innerHTML = `
    <div class="grid3">
      <div class="card xirr-banner"><div class="big ${clr(r.xirr_pct)}">${fmt(r.xirr_pct)}%</div><div class="label">XIRR (true IRR)</div></div>
      <div class="card xirr-banner"><div class="big ${clr(r.annualised_pct)}">${fmt(r.annualised_pct)}%</div><div class="label">Annualised Return</div></div>
      <div class="card xirr-banner"><div class="big ${clr(r.total_return_pct)}">${fmt(r.total_return_pct)}%</div><div class="label">Total Return</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Yearly Breakdown</h3><canvas id="yearly-chart"></canvas></div>
      <div class="card"><h3>Monthly Return %</h3><canvas id="monthly-chart"></canvas></div>
    </div>`;

  // Yearly bar
  const years = Object.keys(yearly).sort();
  const ctx1 = document.getElementById('yearly-chart').getContext('2d');
  new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: years,
      datasets: [{
        label: 'P&L %',
        data: years.map(y => yearly[y].ppl_pct || 0),
        backgroundColor: years.map(y => (yearly[y].ppl_pct||0) >= 0 ? 'rgba(34,197,94,.7)' : 'rgba(239,68,68,.7)'),
        borderRadius: 4,
      }]
    },
    options: { plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#8892a4'},grid:{color:'#2d3353'}}, y:{ticks:{color:'#8892a4'},grid:{color:'#2d3353'}} }, responsive:true }
  });

  // Monthly line
  const months = Object.keys(monthly).sort().slice(-24);
  const ctx2 = document.getElementById('monthly-chart').getContext('2d');
  new Chart(ctx2, {
    type: 'line',
    data: {
      labels: months,
      datasets: [{
        label: 'Monthly %',
        data: months.map(m => monthly[m].monthly_ret_pct || 0),
        borderColor: '#6366f1',
        backgroundColor: 'rgba(99,102,241,.15)',
        fill: true,
        tension: 0.3,
        pointRadius: 3,
      }]
    },
    options: { plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#8892a4',maxRotation:45,font:{size:9}},grid:{color:'#2d3353'}}, y:{ticks:{color:'#8892a4'},grid:{color:'#2d3353'}} }, responsive:true }
  });
}

// ── ALERTS LOG ────────────────────────────────────────────────
async function loadAlerts() {
  const alerts = await api('alerts','?select=*&order=created_at.desc&limit=100');
  const el = document.getElementById('alerts-log');
  if (!alerts.length) { el.innerHTML = '<div class="loading">No alerts yet.</div>'; return; }
  el.innerHTML = alerts.map(a => {
    const cls = a.type === 'buy' ? 'buy' : a.type === 'sell' ? 'sell' : '';
    return `<div class="alert-item ${cls}">
      <div class="a-title">${a.title||''}</div>
      <div class="a-body">${a.body||''}</div>
      <div class="a-time">${a.created_at ? new Date(a.created_at).toLocaleString('en-GB') : ''} · ${a.type||'info'}</div>
    </div>`;
  }).join('');
}

// ── ROUTER ────────────────────────────────────────────────────
const loaders = {
  overview: loadOverview,
  heatmap: loadHeatmap,
  positions: loadPositions,
  analyst: loadAnalyst,
  strategy: loadStrategy,
  returns: loadReturns,
  alerts: loadAlerts,
};
const loaded = {};

function loadTab(id) {
  if (loaded[id]) return;
  loaded[id] = true;
  loaders[id]().catch(e => {
    console.error(id, e);
    const el = document.querySelector(`#${id} .loading`) || document.getElementById(id);
    if (el) el.innerHTML = `<div class="loading" style="color:var(--red)">Error: ${e.message}</div>`;
  });
}

loadTab('overview');
</script>
</body>
</html>
